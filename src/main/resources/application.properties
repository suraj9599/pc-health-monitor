spring.application.name=PCHealthMonitor
server.port=8080

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/pc_health_monitor}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Monitoring configuration
monitoring.collection-interval=30000
monitoring.retention-days=7
monitoring.cleanup-cron=0 0 2 * * *




